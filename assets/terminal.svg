<svg xmlns="http://www.w3.org/2000/svg" width="480" height="418" viewBox="0 0 480 418" role="img" aria-labelledby="t d">
  <title id="t">Terminal: whoami, goal and roadmap</title>
  <desc id="d">whoami: yusuf, computer engineering student, blue team in progress. Goal: SOC / network security internship. Roadmap: done - CTF write-ups (TSGK 4th CTF, picoCTF); in progress - Cisco CCNA; planned - packet capture analysis report, home lab with Wazuh and attack simulation, writing my own detection rules.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; fill: #c9d1d9; }
    .bar { font-size: 12.5px; fill: #8b949e; }
    .p { fill: #3fb950; font-weight: 700; }
    .c { fill: #79c0ff; }
    .o { fill: #e6edf3; }
    .dim { fill: #8b949e; }
    .ok { fill: #3fb950; font-weight: 700; }
    .wip { fill: #e3b341; font-weight: 700; }
    .todo { fill: #6e7681; font-weight: 700; }
    .hl { fill: #ff7b72; }
    .l { animation: in .45s ease-out both; }
    .l1 { animation-delay: .2s; } .l2 { animation-delay: .7s; }
    .l3 { animation-delay: 1.2s; } .l4 { animation-delay: 1.6s; }
    .l5 { animation-delay: 2.1s; } .l6 { animation-delay: 2.5s; }
    .l7 { animation-delay: 2.7s; } .l8 { animation-delay: 2.9s; }
    .l9 { animation-delay: 3.1s; } .l10 { animation-delay: 3.3s; }
    .l11 { animation-delay: 3.7s; }
    .cur { animation: blink 1.1s steps(1) 3.7s infinite; }
    @keyframes in { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .l, .cur { animation: none; } }
  </style>
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset=".5" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#bc8cff"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="478" height="416" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <path d="M1 13a12 12 0 0 1 12-12h454a12 12 0 0 1 12 12v25H1z" fill="#161b22"/>
  <rect x="1" y="38" width="478" height="2" fill="url(#glow)"/>
  <circle cx="22" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="20" r="6" fill="#febc2e"/>
  <circle cx="62" cy="20" r="6" fill="#28c840"/>
  <text class="bar" x="240" y="24" text-anchor="middle">yusuf@github: ~</text>

  <g class="l l1"><text x="24" y="74"><tspan class="p">~ $</tspan> <tspan class="c">whoami</tspan></text></g>
  <g class="l l2"><text x="24" y="98" class="o">yusuf <tspan class="dim">·</tspan> computer engineering student</text><text x="24" y="122" class="o"><tspan class="c">blue team</tspan> in progress</text></g>

  <g class="l l3"><text x="24" y="160"><tspan class="p">~ $</tspan> <tspan class="c">cat goal.txt</tspan></text></g>
  <g class="l l4"><text x="24" y="184" class="o"><tspan class="hl">▸</tspan> SOC / network security internship</text></g>

  <g class="l l5"><text x="24" y="222"><tspan class="p">~ $</tspan> <tspan class="c">cat roadmap.txt</tspan></text></g>
  <g class="l l6"><text x="24" y="246" class="o"><tspan class="ok">[x]</tspan> CTF write-ups <tspan class="dim">(TSGK 4th CTF, picoCTF)</tspan></text></g>
  <g class="l l7"><text x="24" y="270" class="o"><tspan class="wip">[~]</tspan> Cisco CCNA</text></g>
  <g class="l l8"><text x="24" y="294" class="o"><tspan class="todo">[ ]</tspan> Packet capture analysis report</text></g>
  <g class="l l9"><text x="24" y="318" class="o"><tspan class="todo">[ ]</tspan> Home lab: Wazuh + attack simulation</text></g>
  <g class="l l10"><text x="24" y="342" class="o"><tspan class="todo">[ ]</tspan> Writing my own detection rules</text></g>

  <g class="l l11"><text x="24" y="382"><tspan class="p">~ $</tspan></text><rect class="cur" x="62" y="369" width="9" height="17" fill="#3fb950"/></g>
</svg>

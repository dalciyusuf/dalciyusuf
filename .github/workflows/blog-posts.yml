name: Medium yazı listesi

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: README'deki Medium listesini güncelle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Medium yazılarını çek
        uses: gautamkrishnar/blog-post-workflow@f177491c77670f150ab4e9b9890254d8eba4164b # 1.9.7
        with:
          feed_list: "https://medium.com/feed/@dalciyusuf"
          max_post_count: 5
          user_agent: "Mozilla/5.0"
          item_exec: "post.url = post.url.split('?')[0];"
          commit_message: "docs: Medium yazı listesi güncellendi"
          dummy_commit_message: "chore: depo etkin tutuldu"
